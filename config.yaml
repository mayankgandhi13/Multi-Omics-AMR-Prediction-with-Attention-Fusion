# One place for every knob in the project.
# Paths are relative to the repo root unless you give an absolute path.

# Where data lives. On Explorer this is overridden by $AMR_DATA_DIR
# (set in slurm/common.sh) so big files go to /scratch, not /home.
data_dir: data
results_dir: results

antibiotics: [CIP, CTX, CTZ, GEN]

seed: 42
n_folds: 5

lineage:
  # Isolates closer than this fraction of SNP positions count as "family"
  # and always land in the same fold. 0.02 = 2% (~1,200 of ~61k SNP positions).
  max_distance: 0.02

fcgr:
  k: 6          # 4^6 = 4,096 possible 6-letter words -> a 64x64 image

cnn:
  epochs: 50
  batch_size: 8   # same as the original paper
  lr: 0.001
  weight_decay: 0.0001

# --- Phase 2 (pangenome) ---
# An assembly must look like a whole, clean E. coli genome to go any further.
# Thresholds modelled on EnteroBase's E. coli criteria.
assembly_qc:
  min_length: 3700000   # bp; much smaller = big chunks missing
  max_length: 6400000   # bp; much bigger = probably two strains mixed together
  max_contigs: 800      # more pieces than this = too shattered to trust
  min_n50: 20000        # half the genome sits in contigs at least this long

pangenome:
  # Keep genes that vary: present in at least 1% and at most 99% of isolates.
  # Genes everyone has (core) or almost no one has can't tell isolates apart.
  min_frequency: 0.01
  max_frequency: 0.99
  # Lineage families for honest splits, as in Phase 1, but measured on gene
  # content: isolates closer than this fraction of variable genes are "family".
  lineage_max_distance: 0.10   # 221 families, biggest 15%: same shape as Phase 1 (242, 20%)

snps:
  # Keep SNP positions seen in at least 1% of isolates. (Ren et al. used 20%,
  # which would sit right at the frequency of key resistance mutations like
  # gyrA S83L, ~22% here, and could throw them away.)
  min_frequency: 0.01
